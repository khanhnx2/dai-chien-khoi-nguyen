<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <title>Đại chiến Khôi Nguyên</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1a1a2e; overflow: hidden; }
      /* Neo khung game vào viewport thật (iOS: height:100% qua html/body báo sai sau
         khi xoay ngang → dùng position:fixed + dvh để luôn phủ đúng màn hình). */
      #game {
        position: fixed; inset: 0;
        width: 100vw; height: 100vh; height: 100dvh;
        display: flex; align-items: center; justify-content: center;
      }

      /* Nút PWA nổi (Cài đặt / Cập nhật) */
      .pwa-btn {
        position: fixed; z-index: 30; border: none; border-radius: 8px;
        color: #fff; font-size: 14px; font-weight: 700; padding: 10px 14px;
        cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.4); font-family: system-ui, sans-serif;
      }
      #install-btn { right: 12px; bottom: 12px; background: #16a34a; }
      #update-btn  { right: 12px; top: 12px; background: #2563eb; }
      .pwa-btn[hidden] { display: none; }

      /* Lớp phủ nhắc xoay ngang — chỉ hiện trên điện thoại đang để DỌC */
      #rotate-overlay {
        position: fixed; inset: 0; z-index: 40; display: none;
        background: #0f0f1e; color: #fff; text-align: center;
        align-items: center; justify-content: center; padding: 24px;
        font-family: system-ui, sans-serif;
      }
      #rotate-overlay .msg { font-size: 20px; line-height: 1.5; }
      #rotate-overlay .icon { font-size: 56px; display: block; margin-bottom: 12px; animation: spin 2s ease-in-out infinite; }
      @keyframes spin { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-90deg); } }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate-overlay { display: flex; }
      }

      /* Hướng dẫn cài trên iOS (hiện khi bấm nút cài trên iPhone/iPad) */
      #ios-help {
        position: fixed; inset: auto 12px 64px 12px; z-index: 31; display: none;
        background: #1e293b; color: #fff; border-radius: 10px; padding: 14px 16px;
        font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.5;
        box-shadow: 0 2px 10px rgba(0,0,0,.5);
      }
      #ios-help b { color: #fde047; }
    </style>
  </head>
  <body>
    <div id="game"></div>

    <button id="install-btn" class="pwa-btn" hidden>📲 Cài đặt App</button>
    <button id="update-btn" class="pwa-btn" hidden>⬆️ Cập nhật bản mới</button>

    <div id="ios-help">
      Cài trên iPhone/iPad: bấm nút <b>Chia sẻ</b> ⬆️ dưới thanh trình duyệt →
      chọn <b>Thêm vào MH chính</b>.
    </div>

    <div id="rotate-overlay">
      <div class="msg"><span class="icon">📱</span>Xoay ngang điện thoại để chơi</div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
